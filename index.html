<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Jogo de adivinhação </title>
    
        <style>
            .corpoDapagina{
                font-family: Arial, sans-serif;
                background-color: rgb(148,182,53);
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                margin: 0;
            }

            h1{
                color: #333;

            }
            .container{
                text-align: center;
                background-color: #fff;
                padding: 20px;
                border-radius: 10px;
                box-shadow: 0px 0px 10px rgba(0, 0, 0, 0,1);
            }

            input[type="number"]{
               padding: 10px;
               font-size: 16px;
               width: 50px;
               margin-botton: 10px
            }

            button{
                padding: 10px 20px;
                font-size: 16px;
                cursor: pointer;
                background-color: #28a745;
                color: #fff;
                border: none;
                border-radius: 5px;
            }
            
            .mensage{
                margin-top: 20px;
                font-size: 18px;
            }    
        </style>

    </head
    
    <body class="CorpoDaPagina">
        
            <div class="container">

               <h1>&#128564;Jogo de adivinhação &#128565;</h1>
               <p>Tente adivinhar o número secreto entre 1 e 100</p>

               <input type="number" id="TXTPalpite" min="1" max="100"/>
               <button id="BTNAdivinhar" onclick="verificarPalpite()" >Adivinhar</button>
               <div class="mensage" id="DIVMensagem"> </div>
            </div>

    
    </body>
    
    <script>
        let numerosecreto = Math.floor(Math.random() * 100);

        function verificarPalpite(){
        //-----------------------------------
        //1º Verificar se o jogador digitou
        //   algum numero na caixa de texto
        //-----------------------------------
        let caixaDeTexto = document.getElementById('TXTPalpite');
        let dvMensagem = document.getElementById('DIVMensagem');

        let ChuteDoJogador = parseInt (caixaDeTexto.value);

            //validaçao do nº digitado. o campo nao pode ser vazio e o nº deve estar entre 0 e 100
        if( isNaN(ChuteDoJogador) || ChuteDoJogador < 1 || ChuteDoJogador > 100){
            dvMensagem.textContent = 'Por favor, insira um número válido entre 1 e 100';
            return;

            }

        if(ChuteDoJogador === numerosecreto){
            dvMensagem.textContent = 'Parabéns! Você acertou o número secreto'+numerosecreto;
            desabilitarJogo();
        }else{
            dvMensagem.textContent = 'Errou!';
        }   

        }
        function desabilitarJogo (){
            document.getElementById('BTNAdivinhar').disabled = true;
            document.getElementById('TXTPalpite').disabled = true;
        }
    
    
    </script>    

</html>
